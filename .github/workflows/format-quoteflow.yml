name: Format QuoteFlow

on:
  push:
    branches:
      - quoteflow-mvp

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: quoteflow-mvp
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format QuoteFlow files
        run: pnpm exec prettier --write app/quoteflow tests/quoteflow.test.mjs

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/quoteflow tests/quoteflow.test.mjs
          git commit -m "Format QuoteFlow MVP"
          git push origin HEAD:quoteflow-mvp
